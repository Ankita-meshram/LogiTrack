<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Parcel</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="register-card">

<div class="top">

<h2>Book Parcel</h2>

<p>Fill Parcel Information</p>

</div>

<form class="form" action="/save_parcel" method="POST">

<input
type="text"
name="sender"
placeholder="Sender Name"
required>

<input
type="text"
name="receiver"
placeholder="Receiver Name"
required>

<input
type="text"
name="phone"
placeholder="Phone Number"
required>

<textarea
name="address"
placeholder="Delivery Address"
required></textarea>

<input
type="text"
name="pincode"
placeholder="Pincode"
required>

<button
type="submit"
class="signupBtn">

Book Parcel

</button>

</form>

</div>

</body>
</html>
